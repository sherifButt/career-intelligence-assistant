name: Publish image

# Builds the app image and publishes it to GitHub Container Registry (GHCR)
# at ghcr.io/sherifbutt/career-intelligence-assistant. Runs on every push to
# main, on version tags, and on manual dispatch. Uses the built-in GITHUB_TOKEN
# (no extra secrets needed).
#
# NOTE: a freshly published GHCR package is PRIVATE. For Coolify to pull it
# without credentials, make the package public once:
#   GitHub → your profile → Packages → career-intelligence-assistant →
#   Package settings → Change visibility → Public.

on:
  push:
    branches: [main]
    tags: ['v*']
  workflow_dispatch:

env:
  IMAGE: ghcr.io/sherifbutt/career-intelligence-assistant

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Derive tags & labels
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.IMAGE }}
          tags: |
            type=raw,value=latest,enable={{is_default_branch}}
            type=sha,format=short
            type=ref,event=tag

      - name: Set up Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
